# git-cliff configuration for kyaulabs/7days-mods

[changelog]
header = """
# 📜 Changelog\n
All notable changes to this project are documented here.\
See [Conventional Commits](https://conventionalcommits.org) and
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\\
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/kyaulabs/7days-mods/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\\
    ## Unreleased
{% endif %}\\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/kyaulabs/7days-mods/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/kyaulabs/7days-mods/issues/$1" },
  { pattern = "RFC(\\d+)", text = "ietf-rfc$1", href = "https://datatracker.ietf.org/doc/html/rfc$1" },
]
commit_parsers = [
  { message = "^feat|^patch", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^doc", group = "📝 Documentation" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactor" },
  { message = "^style", group = "💄 Styling" },
  { message = "^test", group = "⚗️ Testing" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "🔮 Misc" },
  { message = "^ignore", skip = true },
  { body = ".*security", group = "🔒 Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
